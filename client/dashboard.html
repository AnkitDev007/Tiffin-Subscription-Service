<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | TiffinFlow</title><link rel="stylesheet" href="styles.css"></head><body><main><header><a class="brand" href="/"><span class="logo">▰</span>TiffinFlow</a><button id="openDialog">+ Add subscriber</button></header><section class="intro"><p>OPERATIONS DASHBOARD</p><h1>Lunch service, billed fairly.</h1><span>Delivery-aware subscriptions and pro-rated invoices.</span></section><section class="kpis" id="kpis"></section><section class="panel"><div class="toolbar"><div><h2>Subscribers</h2><small>Charges are calculated only from delivered meals.</small></div><input id="search" placeholder="Search name or phone"><select id="sort"><option value="name:asc">Name A–Z</option><option value="name:desc">Name Z–A</option><option value="monthly_price:desc">Highest plan price</option><option value="status:asc">Status</option></select></div><table><thead><tr><th>Customer</th><th>Plan</th><th>Delivered</th><th>Pro-rated bill</th><th>Status</th><th></th></tr></thead><tbody id="customers"></tbody></table><div class="pagination"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></section></main><dialog id="dialog"><form id="customerForm"><h2>Add subscriber</h2><label>Name<input name="name" required></label><label>Phone<input name="phone" required></label><label>Plan<select name="plan"><option>Starter</option><option selected>Standard</option><option>Family</option></select></label><label>Monthly plan price<input name="monthlyPrice" type="number" min="1" required></label><div><button type="button" id="cancel">Cancel</button><button>Save subscriber</button></div></form></dialog><template id="row"><tr><td class="name"></td><td class="plan"></td><td class="delivered"></td><td class="bill"></td><td class="state"></td><td><button class="toggle"></button></td></tr></template><script src="app.js"></script></body></html>
